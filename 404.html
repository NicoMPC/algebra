<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// GitHub Pages ne fait pas de réécriture d'URL : toute adresse inconnue sert ce fichier.
// Le lien de partage parent matheux.fr/b/<token> est redirigé ici vers bilan.html?t=<token>.
(function () {
  var m = location.pathname.match(/^\/b\/([0-9A-Za-z_-]{1,128})\/?$/);
  if (m) location.replace('/bilan.html?t=' + encodeURIComponent(m[1]) + location.hash);
})();
</script>
<title>Page introuvable — Matheux</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F172A">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F172A;--blue:#1E40AF;--sub:#475569;--bg:#F8FAFC;--brd:#E2E8F0;--cta:#34D399;--cta-ink:#062B1F}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--navy);line-height:1.55;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:420px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:'Syne',system-ui,sans-serif;font-weight:800;font-size:1.15rem;color:var(--navy);text-decoration:none}
.logo img{width:28px;height:28px}
h1{font-family:'Syne',system-ui,sans-serif;font-weight:800;font-size:1.6rem;line-height:1.15;margin:28px 0 8px}
p{margin:0 0 24px;color:var(--sub)}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:12px;font-family:'Syne',system-ui,sans-serif;font-weight:700;text-decoration:none}
.btn-cta{background:var(--cta);color:var(--cta-ink)}
.btn-ghost{margin-top:10px;background:#fff;color:var(--navy);border:1.5px solid var(--brd)}
:focus-visible{outline:3px solid #60A5FA;outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="logo" href="/"><img src="/assets/mark-navy.png" alt="" width="28" height="28">Matheux</a>
  <h1>Page introuvable</h1>
  <p>Cette adresse n'existe pas ou n'existe plus.</p>
  <a class="btn btn-cta" href="/app.html#diag-404">Faire le diagnostic gratuit</a>
  <a class="btn btn-ghost" href="/">Retour à l'accueil</a>
</main>
</body>
</html>
